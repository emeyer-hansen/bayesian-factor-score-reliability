name: FAIR check

on:
  workflow_dispatch:

jobs:
  howfairis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install howfairis
        run: pip install howfairis
      - name: Run the FAIR check
        run: howfairis https://github.com/${{ github.repository }}
